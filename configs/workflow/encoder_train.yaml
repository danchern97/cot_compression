# @package _global_
#
# Train the compressor against a frozen Qwen3-0.6B.
#
# A separate workflow file rather than overrides on another, for the reason
# sft_train_06b.yaml documents at length: run_name carries no model identifier,
# so a shared run_tag resolves two campaigns onto one directory and
# resume_from_checkpoint=auto would load the wrong weights. Defaulting run_tag
# here makes that unreachable by forgetting a flag;
# check_encoder_architecture is the second line of defence.

defaults:
  - /paths: default
  - /data: dolci_compression_traces
  - /method: qwen3/0_6b
  - /encoder: baseline
  - /training: encoder
  - /evaluation: answer_loss
  - /optim: adamw
  - /logging: wandb
  - _self_

mode: encoder_train

optim:
  lr: 0.0003
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8

# Compression ratio lives under evaluation.methods.patching so the encoder and
# the training-free baselines it is compared against read one knob, not two.
evaluation:
  methods:
    patching:
      compression_ratio: 4.0

logging:
  group: encoder
  name: ${run_name}
  tags:
    - encoder
    - vq
    - qwen3-0.6b

run_tag: enc-qwen3-0.6b
# Every axis that changes what is being trained must appear here: run_name is both
# the run directory and the W&B run id, so two arms that collide share a checkpoint
# and `resume_from_checkpoint=auto` loads the wrong weights. `patching` is included
# because it is NOT part of EncoderConfig, so check_encoder_architecture cannot
# catch a collision on it.
run_name: ${run_tag}_cr${evaluation.methods.patching.compression_ratio}_c${encoder.codebook_size}_${encoder.patching}_${encoder.latent_init}_${encoder.self_attn_mask}-${encoder.cross_attn_mask}_pe${encoder.position_encoding}_np${encoder.next_patch_weight}_lr${optim.lr}

paths:
  run_dir: ${paths.output_dir}/runs/encoder/${data.name}/${run_name}

hydra:
  run:
    dir: ${paths.run_dir}
  sweep:
    dir: ${paths.run_dir}
    subdir: .
  job:
    chdir: false
