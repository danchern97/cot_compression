seed: 1337
device: auto
torch_dtype: bfloat16
max_length: null
# Non-binding row cap: max_batch_tokens is what actually limits a batch. It
# matters once a compressed CoT is short enough that the token budget no longer
# ends the batch -- at high compression ratios this drives most of the speedup.
batch_size: 64
max_batch_tokens: 32768
# DataLoader worker processes for per-sample CPU prep (tokenization dominates
# eval CPU time). 0 keeps prep on the main thread. snellius_h100 allocates 16
# cores; 14 leaves one for the main process and one for the writer thread.
num_workers: 14
# In-flight samples per worker; bounds prep memory (num_workers * this * ~sample).
prefetch_factor: 4
max_examples: null
# Which split to score, named semantically: "validation" resolves to the SFT
# corpus's `eval` split and the trace corpus's `val` split. Phase 1 scores `test`;
# leave it unset for in-training evaluation.
split: null
metric: answer_logprob
normalize_by_length: true
save_token_logprobs: true
# Directory holding the precomputed CoT-signal caches (one npz per signal, keyed
# by model). Null => compute inline on demand. Point it at a persistent path to
# reuse across a sweep. CoT signals are always conditioned on the full prompt
# (never isolated). The name is historical -- it now holds every signal cache.
entropy_cache_dir: null
# Which per-token signals `precompute` computes and caches. Both come from one
# forward pass, so caching both is nearly free.
precompute_signals: [entropy, surprisal]
# Shard the precompute across jobs. Rows split into contiguous disjoint ranges;
# each shard writes to <cache_dir>/shards/ and `merge_traces` assembles them.
# num_shards=1 writes the final cache directly, so nothing changes for small runs.
shard: 0
num_shards: 1
# Optional scratch mirror. When set, the large tokens.jsonl (and answer-entropy
# npz) are written ONLY under <scratch_dir>/<job>/artifacts, while the small
# summary.json/samples.jsonl go to both the run dir and here. Keeps the ~0.7 GB/
# job token stream off a quota-limited HOME run dir. Null => everything in the
# run dir. Point it at /scratch-shared/$USER/... on Snellius.
scratch_dir: null
# Save per-config answer-token entropies (artifacts/answer_entropies.npz).
save_entropies: false
methods:
  enabled:
    - base
    - random
  patching:
    # Target compression ratio (= original_len / compressed_len = average patch
    # length, >= 1). Shared universal knob for uniform and every signal-based
    # strategy. Signal patching strategies are "<signal>_<rule>" with signal in
    # {entropy, surprisal} and rule in {threshold, diff, sum} -- e.g.
    # entropy_sum, surprisal_threshold; each derives its own splitting constraint
    # so the realized average patch length matches this ratio.
    compression_ratio: 2.0
    random:
      max_exponent: 6
  random:
    patching: null
  simple_mean:
    patching: null
  # Every latent of a paragraph step holds that step's mean embedding: the step
  # encoder's initialization, and so the control it must beat. Only meaningful
  # with `paragraph`; under token patching it is a per-patch mean.
  step_mean:
    patching: paragraph
  entropy_weighted_mean:
    patching: null
    # softmax(ln H / T) pooling temperature: T=1 -> plain entropy-weighted mean,
    # T=0 -> keep only the highest-entropy token per patch.
    temperature: 1.0
  surprisal_weighted_mean:
    patching: null
    # softmax(ln(-log p) / T) pooling temperature: T=1 -> weight by surprisal
    # share, T=0 -> keep only the highest-surprisal token per patch.
    temperature: 1.0
  # The trained compressor, scored on the same rows and under the same join key
  # as everything above. `patching` must match what the encoder was trained with:
  # the checkpoint fixes the architecture and the latent init, but K comes from
  # here, and scoring at a ratio the encoder never saw would compare two things.
  learned:
    patching: uniform
    # Directory holding encoder.pt + encoder_config.json, e.g.
    # <run_dir>/checkpoints/best. Null => `learned` cannot be enabled.
    checkpoint: null
